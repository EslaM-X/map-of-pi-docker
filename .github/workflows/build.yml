name: Map of Pi Docker Build

# Controls when the workflow will execute
on:
  # Triggers the workflow on push or pull request events for the "main" and "dev" branch
  push:
    branches: 
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  build:
    name: 🏗️ Build Frontend & Backend
    runs-on: ubuntu-latest
    # The sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      # Backend CI Process
      - name: Install Backend Dependencies
        run: | 
          cd backend
          npm ci
      
      - name: Build Backend
        run: |
          cd backend
          npm run build

      # Frontend CI Process
      - name: Install Frontend Dependencies
        run: | 
          cd frontend
          npm ci

      - name: Build Frontend
        run: | 
          cd frontend
          npm run build

  test:
    name: ✅ Run Backend Unit Tests
    runs-on: ubuntu-latest
    needs: build
    # The sequence of tasks that will be executed as part of the job
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Node
        uses: actions/setup-node@v3
        with:
          node-version: 18.x

      - name: Install Backend Dependencies
        run: | 
          cd backend
          npm ci

      - name: Execute Backend Tests
        run: | 
          cd backend
          npm run test -- --passWithNoTests